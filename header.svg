<svg width="100%" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse {
      0% { opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { opacity: 0.1; }
    }
    .floating { animation: float 6s ease-in-out infinite; }
    .pulsing { animation: pulse 4s ease-in-out infinite; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1000" height="400" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <rect width="1000" height="400" fill="url(#grid)"/>

  <!-- Decorative Abstract Elements (Circles and Lines) -->
  <circle cx="150" cy="100" r="200" fill="#00f2fe" opacity="0.03" filter="url(#glow)"/>
  <circle cx="850" cy="300" r="250" fill="#4facfe" opacity="0.03" filter="url(#glow)"/>
  
  <!-- Animated Data Lines -->
  <g class="pulsing">
    <path d="M0,200 Q250,150 500,200 T1000,200" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <path d="M0,220 Q250,180 500,220 T1000,220" fill="none" stroke="url(#accent)" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- Typography -->
  <g transform="translate(500, 180)" text-anchor="middle" class="floating">
    <text y="0" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="14">
      GOHAR REHMAN
    </text>
    <text y="40" font-family="monospace" font-size="14" font-weight="500" fill="#666666" letter-spacing="6">
      &lt; SOFTWARE_ENGINEER / BACKEND_ARCHITECT &gt;
    </text>
  </g>

  <!-- Status / Info Pill -->
  <g transform="translate(500, 270)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#111111" stroke="#333333" stroke-width="1"/>
    <circle cx="-115" cy="0" r="4" fill="#00ff00" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-100" y="4" font-size="11" font-weight="600" fill="#aaaaaa" letter-spacing="1" text-anchor="start">
      AVAILABLE FOR WORK
    </text>
    <line x1="-5" y1="-10" x2="-5" y2="10" stroke="#333333" stroke-width="1"/>
    <text x="10" y="4" font-size="11" font-weight="600" fill="#aaaaaa" letter-spacing="1" text-anchor="start">
      BASED IN PAKISTAN
    </text>
  </g>
</svg>
